<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Martillo Demoledor Hexagonal -->
  <path d="M70 40 L130 40 L130 65 L70 65 Z" fill="#000000" stroke="#000000" stroke-width="2"/>
  <rect x="85" y="65" width="30" height="55" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <line x1="90" y1="75" x2="110" y2="75" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="85" x2="110" y2="85" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="95" x2="110" y2="95" stroke="#000000" stroke-width="2"/>
  <!-- Empuñadura T -->
  <path d="M50 30 L150 30 L150 40 L50 40 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="90" y="20" width="20" height="15" fill="#000000"/>
  <!-- Cilindro y Cincel -->
  <polygon points="90,120 110,120 105,170 95,170" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <polygon points="95,170 105,170 100,185" fill="#000000" stroke="#000000" stroke-width="2"/>
  <!-- Amortiguadores -->
  <circle cx="75" cy="52" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="125" cy="52" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="100" y="196" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" fill="#000000">MARTILLO DEMOLEDOR 30KG</text>
</svg>
