<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Disco de Corte Diamantado -->
  <circle cx="65" cy="135" r="42" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="65" cy="135" r="12" fill="#000000"/>
  <!-- Dientes o ranuras del disco -->
  <line x1="65" y1="95" x2="65" y2="105" stroke="#000000" stroke-width="2"/>
  <line x1="65" y1="165" x2="65" y2="175" stroke="#000000" stroke-width="2"/>
  <line x1="25" y1="135" x2="35" y2="135" stroke="#000000" stroke-width="2"/>
  <line x1="95" y1="135" x2="105" y2="135" stroke="#000000" stroke-width="2"/>
  <!-- Protector de Disco -->
  <path d="M25 135 A 42 42 0 0 1 107 135" fill="none" stroke="#000000" stroke-width="8"/>
  <!-- Motor y Chasis -->
  <rect x="75" y="85" width="70" height="45" rx="4" fill="#000000" stroke="#000000" stroke-width="2"/>
  <rect x="90" y="70" width="40" height="15" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Empuñadura / Manillar -->
  <path d="M125 90 L165 45 L150 40" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Rueda Trasera -->
  <circle cx="150" cy="145" r="16" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="150" cy="145" r="5" fill="#000000"/>
  <text x="100" y="194" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" fill="#000000">CORTADORA DE PAVIMENTO 14"</text>
</svg>
