<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <!-- Llave inglesa y martillo cruzados (Herramienta genérica de obra) -->
  <g transform="rotate(45 100 100)">
    <!-- Mango martillo -->
    <rect x="92" y="40" width="16" height="120" rx="3" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <!-- Cabeza martillo -->
    <rect x="70" y="30" width="60" height="24" rx="2" fill="#000000"/>
  </g>
  <g transform="rotate(-45 100 100)">
    <!-- Mango llave -->
    <rect x="93" y="45" width="14" height="110" rx="2" fill="#000000"/>
    <!-- Cabeza llave -->
    <circle cx="100" cy="40" r="18" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <polygon points="92,26 108,26 104,46 96,46" fill="#000000"/>
  </g>
  <text x="100" y="190" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" fill="#000000">ACTIVO TÉCNICO BUILDCORP</text>
</svg>
