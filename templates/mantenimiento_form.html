{% extends 'base.html' %}

{% block title %}Programar Mantenimiento — BuildCorp{% endblock %}

{% block content %}
<div style="max-width: 840px; margin: 0 auto; width: 100%;">
    <div class="page-header-bar" style="margin-bottom: 18px;">
        <div class="page-title-group">
            <h1 class="page-heading">Programar Mantenimiento</h1>
            <p class="page-caption">Crea una orden para revisión preventiva, reparación o calibración de una herramienta.</p>
        </div>
        <a href="{% url 'mantenimientos' %}" class="btn btn-secondary">&larr; Volver a Mantenimientos</a>
    </div>

    <form method="POST" class="form-card" style="margin-bottom: 32px;">
        {% csrf_token %}

        <div class="form-grid">
            <div class="form-group full">
                <label class="form-label" for="herramienta">Herramienta a revisar o reparar *</label>
                <select name="herramienta" id="herramienta" class="form-control" required>
                    <option value="">-- Elige una herramienta --</option>
                    {% for h in herramientas %}
                        <option value="{{ h.id }}">
                            [{{ h.codigo_inventario }}] {{ h.nombre }} ({{ h.marca }} {{ h.modelo }}) - Uso: {{ h.horas_uso_acumuladas }} hrs [Estado: {{ h.get_estado_display }}]
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="tipo">Tipo de revisión *</label>
                <select name="tipo" id="tipo" class="form-control" required>
                    <option value="PREVENTIVO">Mantenimiento preventivo periódico</option>
                    <option value="CORRECTIVO">Reparación por daño o falla</option>
                    <option value="CALIBRACION">Inspección y calibración</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="fecha_programada">Fecha programada *</label>
                <input type="date" name="fecha_programada" id="fecha_programada" class="form-control" value="{{ hoy|date:'Y-m-d' }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="tecnico_responsable">Técnico o taller a cargo *</label>
                <input type="text" name="tecnico_responsable" id="tecnico_responsable" class="form-control" placeholder="Ej: Taller Central o Juan Pérez" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="costo_estimado">Costo estimado ($ CLP)</label>
                <input type="number" step="1000" name="costo_estimado" id="costo_estimado" class="form-control mono" value="0">
            </div>

            <div class="form-group full">
                <label class="form-label" for="descripcion_trabajo">Trabajo a realizar o falla reportada *</label>
                <textarea name="descripcion_trabajo" id="descripcion_trabajo" class="form-control" rows="3" placeholder="Detalle de lo que se va a hacer: cambio de aceite, carbones, cables, etc..." required></textarea>
            </div>

            <div class="form-group full">
                <label class="form-label" for="repuestos_utilizados">Repuestos necesarios (opcional)</label>
                <input type="text" name="repuestos_utilizados" id="repuestos_utilizados" class="form-control" placeholder="Ej: Filtro de aire, bujía, carbones">
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-subtle);">
            <a href="{% url 'mantenimientos' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Guardar Orden</button>
        </div>
    </form>
</div>
{% endblock %}
