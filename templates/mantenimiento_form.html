{% extends 'base.html' %}

{% block title %}Programar Mantenimiento — BuildCorp{% endblock %}

{% block content %}
<div class="container-fluid px-0" style="max-width: 860px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 gap-3 border-bottom pb-3">
        <div>
            <h1 class="page-heading">Programar Mantenimiento</h1>
            <p class="page-caption">Crea una orden para revisión técnica periódica, calibración o reparación por falla mecánica.</p>
        </div>
        <a href="{% url 'mantenimientos' %}" class="btn btn-outline-secondary d-inline-flex align-items-center gap-1">
            <i class="bi bi-arrow-left"></i>
            <span>Volver a Mantenimientos</span>
        </a>
    </div>

    <form method="POST" class="card-panel p-4 mb-4">
        {% csrf_token %}

        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="herramienta">Herramienta a revisar o reparar *</label>
                <select name="herramienta" id="herramienta" class="form-select" required>
                    <option value="">-- Elige una herramienta --</option>
                    {% for h in herramientas %}
                        <option value="{{ h.id }}">
                            [{{ h.codigo_inventario }}] {{ h.nombre }} ({{ h.marca }} {{ h.modelo }}) - Horómetro: {{ h.horas_uso_acumuladas }} hrs [Estado: {{ h.get_estado_display }}]
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="tipo">Tipo de revisión *</label>
                <select name="tipo" id="tipo" class="form-select" required>
                    <option value="PREVENTIVO">Mantenimiento preventivo periódico</option>
                    <option value="CORRECTIVO">Reparación por daño o falla</option>
                    <option value="CALIBRACION">Inspección y calibración</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="fecha_programada">Fecha programada *</label>
                <input type="date" name="fecha_programada" id="fecha_programada" class="form-control" value="{{ hoy|date:'Y-m-d' }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="tecnico_responsable">Técnico o taller a cargo *</label>
                <input type="text" name="tecnico_responsable" id="tecnico_responsable" class="form-control" placeholder="Ej: Taller Central o Juan Pérez" required>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="costo_estimado">Costo estimado ($ CLP)</label>
                <div class="input-group">
                    <span class="input-group-text small text-muted">$</span>
                    <input type="number" step="1000" name="costo_estimado" id="costo_estimado" class="form-control mono" value="0">
                </div>
            </div>

            <div class="col-12">
                <label class="form-label" for="descripcion_trabajo">Trabajo a realizar o falla reportada *</label>
                <textarea name="descripcion_trabajo" id="descripcion_trabajo" class="form-control" rows="3" placeholder="Detalle de la intervención técnica: cambio de carbones, ajuste de transmisión, cables, lubricación..." required></textarea>
            </div>

            <div class="col-12">
                <label class="form-label" for="repuestos_utilizados">Repuestos e insumos necesarios (opcional)</label>
                <input type="text" name="repuestos_utilizados" id="repuestos_utilizados" class="form-control" placeholder="Ej: Filtro de aire, bujía, carbones">
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{% url 'mantenimientos' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-2 px-4 shadow-sm">
                <i class="bi bi-check2"></i>
                <span>Guardar Orden</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
